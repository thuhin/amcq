# Local development site: http://amcqtest.com
#
#   sudo cp deploy/nginx-amcqtest.conf /etc/nginx/sites-available/amcq
#   sudo ln -s /etc/nginx/sites-available/amcq /etc/nginx/sites-enabled/amcq
#   echo "127.0.0.1       amcqtest.com" | sudo tee -a /etc/hosts
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name amcqtest.com;

    root /usr/share/nginx/www/amcq;
    index index.php;

    access_log /var/log/nginx/amcq_access.log;
    error_log  /var/log/nginx/amcq_error.log;

    # The web root is the repository root, so everything that is not the app
    # entry point or a public asset must be blocked: SQL dumps, the reset
    # script, config, framework source and git history.
    location ~ ^/(application|system|database|deploy|tests|\.git)(/|$) { deny all; return 404; }
    location ~ \.(md|sh|sql|log|example|py)$                      { deny all; return 404; }
    location ~ /\.                                                { deny all; return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param CI_ENV development;
        include fastcgi_params;
    }

    location /asset/ {
        expires 7d;
        access_log off;
    }
}
